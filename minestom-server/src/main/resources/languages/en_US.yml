  factor:
    generic:
      title: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>·</dark_gray> <white>Factor setup</white>"
      intro: "<gray>Enter the required value to continue.</gray>"
      field: "<white>Value</white>"
      button: "<aqua><bold>Setup</bold></aqua>"
    submit-button: "<green><bold>Confirm</bold></green>"
    cancel-button: "<gray>Cancel</gray>"
    completed-hint: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>»</dark_gray> <green>Factor setup completed.</green> <gray>Finish registration when ready.</gray>"
    email:
      title: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>·</dark_gray> <white>Email</white>"
      intro: "<gray>Link an email address to your account.</gray>"
      field: "<white>Email</white>"
      button: "<aqua><bold>Email</bold></aqua>"

