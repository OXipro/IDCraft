    account-locked: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>»</dark_gray> <red>This account is temporarily locked.</red> <gray>Try again later.</gray>"
    wrong-password: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>»</dark_gray> <red>Wrong password.</red>"
    factor-invalid: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>»</dark_gray> <red>Invalid authentication code or value.</red>"
    factor-required: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>»</dark_gray> <red>A required authentication factor is missing.</red>"
    factor-not-enrolled: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>»</dark_gray> <red>This factor is not linked.</red>"
    factor-already-enrolled: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>»</dark_gray> <red>This factor is already linked.</red>"
    provider-unavailable: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>»</dark_gray> <red>Authentication services are unavailable.</red> <gray>Try again later.</gray>"
