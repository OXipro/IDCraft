    intro: "<gray>Welcome back,</gray> <white>%PLAYER%</white><gray>. Enter your password to continue.</gray>"
    password-field: "<white>Password</white>"
    submit-button: "<green><bold>Login</bold></green>"
    command-hint: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>»</dark_gray> <gray>Use</gray> <yellow>/login \\<password></yellow> <gray>to continue.</gray>"
    command-hint-2fa: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>»</dark_gray> <gray>Use</gray> <yellow>/login \\<password> \\<2fa-code></yellow> <gray>to continue.</gray>"
  register:
    title: "<gradient:#FFE082:#FFB300><bold>IDCraft</bold></gradient> <dark_gray>·</dark_gray> <white>Register</white>"
